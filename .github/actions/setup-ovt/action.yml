#
# Shared setup of the build jobs (chapter 13 §13.7.2, WI-0.030): host tools, Python, the vcpkg checkout
# and the caches. The caller has already run actions/checkout. Third-party actions are pinned by commit SHA.
name: setup-ovt
description: Install the build tools of OVT and restore the vcpkg, third_party, ccache and Qt caches.

inputs:
  preset:
    description: Configure preset of the job (for example linux-x64-release); names the per-preset caches.
    required: true
  triplet:
    description: vcpkg target triplet of the preset (for example x64-linux-ovt).
    required: true
  qt:
    description: "'true' installs Qt with tools/install_qt.py and sets QT_ROOT_DIR, so the GUI (ovt_studio) builds."
    default: "false"
  python-version:
    description: Python used by configure-time tools (needs >= 3.11).
    default: "3.12"
  corpora:
    description: >-
      Test corpora (chapter 14 §14.2.4): 'fast' fetches the PR-lane subset (tools/fetch_corpora.py --tags fast, at most
      300 MiB), 'all' every manifest entry (nightly), 'none' nothing. Both restore a cache keyed by the manifest hash,
      fetch what is missing, re-verify the hashes without network and export OVT_CORPORA_DIR.
    default: "none"

runs:
  using: composite
  steps:
    - name: Host packages (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # GCC 13 is not in the ubuntu-22.04 archive (chapter 13 §13.1); take it from the toolchain PPA,
        # like tools/bootstrap.sh prints for 22.04 hosts.
        sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
        sudo apt-get update -q
        grep -v '^\s*#' tools/apt-packages.txt | xargs sudo apt-get install -y -q --no-install-recommends gcc-13 g++-13
        {
          echo "CC=gcc-13"
          echo "CXX=g++-13"
        } >> "$GITHUB_ENV"

    - name: Host tools (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        # The self-hosted Mac runner has no write access to Homebrew; check what tools/brew-packages.txt
        # lists instead of installing it.
        missing=""
        for tool in cmake ninja ccache nasm; do
          command -v "$tool" >/dev/null || missing="$missing $tool"
        done
        command -v pkg-config >/dev/null || command -v pkgconf >/dev/null || missing="$missing pkgconf"
        if [ -n "$missing" ]; then
          echo "::error::missing on this runner:$missing (install from tools/brew-packages.txt)"
          exit 1
        fi
        xcode-select -p

    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      # setup-python's macOS installer writes to /Users/runner, which only exists on GitHub's images.
      if: runner.environment == 'github-hosted'
      with:
        python-version: ${{ inputs.python-version }}

    - name: Python (self-hosted)
      if: runner.environment != 'github-hosted'
      shell: bash
      run: |
        # The runner's own Python (tools/brew-packages.txt: python@3.12) must be >= 3.11 for the configure-time
        # tools (cmake/OvtThirdPartyCommon.cmake).
        for py in python3.13 python3.12 python3.11 python3; do
          if command -v "$py" >/dev/null && "$py" -c 'import sys; sys.exit(sys.version_info < (3, 11))'; then
            dirname "$(command -v "$py")" >> "$GITHUB_PATH" # FindPython3 searches PATH
            "$py" --version
            exit 0
          fi
        done
        echo "::error::no Python >= 3.11 on this runner (brew install python@3.12)"
        exit 1

    - name: Python tools (meson for the third_party Meson builds)
      shell: bash
      run: |
        # A venv works on the hosted images and on the self-hosted Mac (whose Homebrew Python refuses
        # system-wide pip installs). tools/requirements.txt pins meson (chapter 13 §13.3.5).
        python3 -m venv "${RUNNER_TEMP}/ovt-venv"
        "${RUNNER_TEMP}/ovt-venv/bin/python" -m pip install --quiet -r tools/requirements.txt
        echo "${RUNNER_TEMP}/ovt-venv/bin" >> "$GITHUB_PATH"

    - name: vcpkg checkout and bootstrap
      shell: bash
      run: |
        git submodule update --init --depth 1 third_party/vcpkg
        if [ ! -x third_party/vcpkg/vcpkg ]; then
          third_party/vcpkg/bootstrap-vcpkg.sh -disableMetrics
        fi
        mkdir -p build/vcpkg-archives build/third_party/downloads
        # vcpkg's x-gha binary provider was removed in 2025; a files cache saved by actions/cache replaces it.
        echo "VCPKG_BINARY_SOURCES=clear;files,${GITHUB_WORKSPACE}/build/vcpkg-archives,readwrite" >> "$GITHUB_ENV"

    - name: vcpkg binary cache
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: build/vcpkg-archives
        key: vcpkg-${{ runner.os }}-${{ inputs.triplet }}-${{ hashFiles('vcpkg.json', 'third_party/vcpkg-triplets/**', 'third_party/vcpkg-overlays/**') }}
        restore-keys: vcpkg-${{ runner.os }}-${{ inputs.triplet }}-

    - name: third_party install prefix cache
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: build/third_party/${{ inputs.preset }}
        # Exact key only: a prefix restored from other pins or patches would not be reproducible. Per runner: the
        # prefix holds CMake build trees (CMakeCache.txt names the checkout directory), which CMake refuses to
        # reuse from another runner's workspace (the Mini's runners are actions-runner, -runner-2, ...).
        key: tp-${{ runner.os }}-${{ runner.name }}-${{ inputs.preset }}-${{ hashFiles('third_party/VERSIONS.md', 'third_party/*.cmake', 'third_party/patches/**', 'plugins/*/patches/**') }}

    - name: third_party downloads cache
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: build/third_party/downloads
        key: tpdl-${{ hashFiles('third_party/VERSIONS.md') }}
        restore-keys: tpdl-

    - name: ccache
      uses: hendrikmuhs/ccache-action@63069e3931dedbf3b63792097479563182fe70d1 # v1.2.18
      with:
        key: ccache-${{ runner.os }}-${{ inputs.preset }}-${{ github.sha }}
        restore-keys: ccache-${{ runner.os }}-${{ inputs.preset }}-
        max-size: 2G

    - name: ccache settings
      shell: bash
      run: ccache --set-config=compiler_check=content

    - name: Qt cache
      if: inputs.qt == 'true'
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ${{ runner.temp }}/Qt
        key: qt-${{ runner.os }}-6.8.3-${{ hashFiles('tools/install_qt.py') }}

    - name: Qt
      if: inputs.qt == 'true'
      shell: bash
      run: |
        # WI-0.018: the last stdout line is QT_ROOT_DIR=<dest>/6.8.3 (the aqt layout); CMakePresets.json
        # appends the kit directory (gcc_64, macos) to it.
        out="$(python -I tools/install_qt.py --target desktop --dest "${RUNNER_TEMP}/Qt")"
        printf '%s\n' "$out"
        root="$(printf '%s\n' "$out" | sed -n 's/^QT_ROOT_DIR=//p' | tail -n 1)"
        if [ -z "$root" ] || [ ! -d "$root" ]; then
          echo "::error::tools/install_qt.py printed no usable QT_ROOT_DIR"
          exit 1
        fi
        echo "QT_ROOT_DIR=$root" >> "$GITHUB_ENV"

    - name: Corpora cache
      if: inputs.corpora != 'none'
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: build/corpora
        # The manifest hash names the exact set of files; a stale prefix is still useful because the fetcher keeps
        # every file whose SHA-256 matches and downloads only the rest. runner.os is in the key because post-steps
        # (wrap_y4m, ffmpeg trim) write outputs that carry the producing OS's FFmpeg bytes (chapter 14 §14.2.4).
        key: corpora-${{ inputs.corpora }}-${{ runner.os }}-${{ hashFiles('tests/corpora/manifest.json') }}
        restore-keys: corpora-${{ inputs.corpora }}-${{ runner.os }}-

    - name: Fetch corpora
      if: inputs.corpora != 'none'
      shell: bash
      env:
        CORPORA_SET: ${{ inputs.corpora }}
      run: |
        # /bin/bash 3.2 on the Mini: no arrays under set -u. The venv python of "Python tools" is first on PATH.
        case "$CORPORA_SET" in
          fast) filter="--tags fast --max-total-bytes 314572800" ;;
          all) filter="" ;;
          *) echo "::error::corpora must be none, fast or all (got $CORPORA_SET)"; exit 1 ;;
        esac
        mkdir -p build/corpora
        # shellcheck disable=SC2086
        python -I tools/fetch_corpora.py --cache-dir build/corpora $filter
        # shellcheck disable=SC2086
        python -I tools/fetch_corpora.py --cache-dir build/corpora $filter --verify-only
        echo "OVT_CORPORA_DIR=${GITHUB_WORKSPACE}/build/corpora" >> "$GITHUB_ENV"
