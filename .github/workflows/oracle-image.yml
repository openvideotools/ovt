#
# Oracle image (chapter 14 §14.2.6, WI-0.554): builds tests/oracles/Dockerfile, runs `oracle-versions` and
# the smoke test, and on main pushes ghcr.io/openvideotools/ovt-oracles:<yyyymmdd> (plus the moving `main`).
#   pull_request / push to main   when tests/oracles/** or this file changes
#   schedule (monthly)             rebuild without cache and require the same `oracle-versions` report as
#                                  the published `main` image (acceptance test 3: nothing floats); monthly,
#                                  not weekly, to save Actions minutes (a no-cache build takes about 2 h)
#   workflow_dispatch              rebuild and push
# Third-party actions are pinned by commit SHA, never by tag; Renovate keeps the pins fresh.
# Runners: `pins` runs on the owner's Mac Mini (self-hosted, never for fork pull requests); `image` needs Linux
# Docker and skips when the repository variable OVT_HOSTED_RUNNERS is `off` (ci.yml).
name: oracle-image

on:
  pull_request:
    paths: ["tests/oracles/**", ".github/workflows/oracle-image.yml"]
  push:
    branches: [main]
    paths: ["tests/oracles/**", ".github/workflows/oracle-image.yml"]
  schedule:
    - cron: "17 4 1 * *" # 04:17 UTC on the 1st of each month
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/openvideotools/ovt-oracles

jobs:
  pins:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macos-arm64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: every pin is a tag, commit or hash and is recorded in ORACLE_VERSIONS.md
        run: python3 -I tests/oracles/oracle_versions.py --check-pins

  image:
    if: vars.OVT_HOSTED_RUNNERS != 'off'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write # build cache and the image on GHCR
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: free disk space (the build needs about 40 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The toolchain stage (about 40 minutes of apt from snapshot.ubuntu.com) is built and cached on its own:
      # BuildKit exports the cache only when a build succeeds, so a failing oracle stage would otherwise
      # throw it away.
      - name: build the toolchain stage
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tests/oracles
          target: toolchain
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-toolchain
          cache-to: ${{ github.event_name != 'schedule' && format('type=registry,ref={0}:buildcache-toolchain,mode=max', env.IMAGE) || '' }}

      - name: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tests/oracles
          load: true
          tags: ovt-oracles:ci
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:buildcache-toolchain
            type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: ${{ github.event_name != 'schedule' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) || '' }}

      - name: oracle-versions
        run: |
          docker run --rm ovt-oracles:ci oracle-versions | tee oracle-versions.md
          cat oracle-versions.md >> "$GITHUB_STEP_SUMMARY"

      - name: smoke test (every §14.4 command on syn_h265_amp_sao_on.265)
        run: docker run --rm ovt-oracles:ci oracle-smoke-test /tmp/smoke

      - name: same report as the published image (monthly rebuild)
        if: github.event_name == 'schedule'
        run: |
          docker run --rm "${IMAGE}:main" oracle-versions > published.md
          diff -u published.md oracle-versions.md

      - name: push
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          tag="$(date -u +%Y%m%d)"
          for t in "${tag}" main; do
            docker tag ovt-oracles:ci "${IMAGE}:${t}"
            docker push "${IMAGE}:${t}"
          done
          echo "pushed ${IMAGE}:${tag}" >> "$GITHUB_STEP_SUMMARY"

      # The image holds GPL builds and patent-encumbered encoders (ORACLE_VERSIONS.md, "Licences and
      # distribution"), so the package must stay private, and the Free plan cannot forbid public packages at the
      # org level. Anonymous access must be refused: GHCR denies the anonymous token (401) and then the tag
      # listing (401/403/404). Any other answer (200 = public, or no answer) fails the run.
      - name: the GHCR package is private
        run: |
          token="$(curl -sS "https://ghcr.io/token?scope=repository:${IMAGE#ghcr.io/}:pull" |
            python3 -c 'import json, sys; print(json.load(sys.stdin).get("token", ""))' || true)"
          code="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${token}" \
            "https://ghcr.io/v2/${IMAGE#ghcr.io/}/tags/list")"
          echo "anonymous tag listing of ${IMAGE} -> HTTP ${code}"
          case "${code}" in
            401 | 403 | 404) ;;
            200)
              echo "::error::${IMAGE} is public; set it to private in the package settings (GPL + patent-encumbered encoders)"
              exit 1
              ;;
            *)
              echo "::error::could not verify that ${IMAGE} is private (HTTP ${code})"
              exit 1
              ;;
          esac

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: oracle-versions
          path: oracle-versions.md
          if-no-files-found: ignore
