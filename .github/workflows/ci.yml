#
# Main CI workflow (chapter 13 §13.7.1, WI-0.030): lint, build-linux-x64, build-macos-arm64. Later work items
# add their jobs (license-gate, asan-ubsan, clang-tidy, android-build, gui, coverage, ...) to this file.
# Third-party actions are pinned by commit SHA, never by tag; Renovate keeps the pins fresh.
#
# Runners: lint and build-macos-arm64 run on the owner's Mac Mini (self-hosted, label macos-arm64). Jobs that
# need Linux stay on GitHub-hosted runners and skip when the repository variable OVT_HOSTED_RUNNERS is `off`
# (Settings > Secrets and variables > Actions > Variables), the owner's switch for when hosted Actions are
# unavailable. Skipping them drops Linux coverage, so only the owner sets it. Self-hosted jobs never run for
# pull requests from forks (SELF_HOSTED_OK below).
name: ci

on:
  pull_request:
  push:
    # main for the artefacts; ci/** lets a maintainer try a stack of open PRs merged together.
    branches: [main, "ci/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; every push to main runs to the end so its artefacts exist.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    # SELF_HOSTED_OK: never run a fork's code on the Mini.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macos-arm64]
    timeout-minutes: 30
    steps:
      - name: Hosted jobs switched off
        if: vars.OVT_HOSTED_RUNNERS == 'off'
        run: |
          echo "::warning::OVT_HOSTED_RUNNERS=off: build-linux-x64, static-analysis/cppcheck, oracle-image/image and" \
            "bootstrap-check were skipped, so this run has no Linux coverage"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # the changed-file range and check_wi_refs need history

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # The runner's own Python (setup-python writes to /Users/runner, which exists only on GitHub's images),
      # in a venv: Homebrew's Python refuses system-wide pip installs. The same search as setup-ovt.
      - name: Tools
        run: |
          for py in python3.13 python3.12 python3.11 python3; do
            if command -v "$py" >/dev/null && "$py" -c 'import sys; sys.exit(sys.version_info < (3, 11))'; then
              "$py" -m venv "$RUNNER_TEMP/lint-venv"
              echo "$RUNNER_TEMP/lint-venv/bin" >> "$GITHUB_PATH"
              "$RUNNER_TEMP/lint-venv/bin/python" -m pip install --quiet -r tools/requirements.txt pytest==8.3.4 numpy==2.2.1
              exit 0
            fi
          done
          echo "::error::no Python >= 3.11 on this runner (brew install python@3.12)"
          exit 1

      - name: Changed-file range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            from="$PR_BASE"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
              && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            from="$BEFORE"
          else
            from="$(git merge-base origin/main HEAD)"
          fi
          echo "from=$from" >> "$GITHUB_OUTPUT"
          echo "Linting the files changed in $from..HEAD"

      # Formatters, ruff, mypy, reuse-lint-file, shellcheck, ktlint, the SPDX and VERSIONS.md hooks
      # (.pre-commit-config.yaml, WI-0.007). Only the changed files: the files that predate WI-0.007 are not
      # reformatted yet (docs/dev/getting-started.md).
      - name: pre-commit on the changed files
        run: pre-commit run --show-diff-on-failure --from-ref "${{ steps.range.outputs.from }}" --to-ref HEAD

      - name: reuse lint
        run: |
          # Checks whose tooling arrives with a later M0.1 work item run once it is on the branch; on main,
          # after M0.1, every one of them runs (chapter 13 §13.7.1).
          if [ -d LICENSES ]; then reuse lint; else echo "::notice::LICENSES/ arrives with WI-0.600; skipped"; fi

      - name: SPDX directory policy
        run: |
          if [ -f tools/check_spdx_dirs.py ]; then
            python -I tools/check_spdx_dirs.py
          else
            echo "::notice::tools/check_spdx_dirs.py arrives with WI-0.601; skipped"
          fi

      - name: markdownlint on the changed documents
        run: |
          if [ ! -f .markdownlint.yaml ]; then
            echo "::notice::.markdownlint.yaml arrives with WI-0.608; skipped"
            exit 0
          fi
          # docs/**/*.md and the governance files (WI-0.604): every changed Markdown file except docs/spec/,
          # which follows its own layout (chapter 16 §16.2.8).
          # bash 3.2 (macOS /bin/bash) has no mapfile.
          git diff -z --name-only --diff-filter=d "${{ steps.range.outputs.from }}" HEAD -- '*.md' ':!docs/spec/' \
            > "$RUNNER_TEMP/md.list"
          if [ ! -s "$RUNNER_TEMP/md.list" ]; then echo "no Markdown changed"; exit 0; fi
          xargs -0 npx -y markdownlint-cli2@0.17.1 < "$RUNNER_TEMP/md.list"

      - name: Patch headers
        run: |
          if [ -f tools/check_patches.py ]; then python -I tools/check_patches.py; else echo "::notice::WI-0.607; skipped"; fi

      - name: Rename dry run
        run: |
          if [ -f tools/rename_dry_run.sh ]; then tools/rename_dry_run.sh; else echo "::notice::WI-0.606; skipped"; fi

      - name: VERSIONS.md and work-item table
        run: |
          python -I tools/check_versions_md.py
          python -I tools/check_wi_refs.py --table

      - name: Schema text equals the spec (WI-0.080, WI-0.081)
        run: python -I tools/check_schema_in_spec.py docs/spec/06-data-model.md core/schema

      - name: Tool tests
        run: python -m pytest -q tools/tests

  build-linux-x64:
    if: vars.OVT_HOSTED_RUNNERS != 'off' # the owner's switch; see the header
    runs-on: ubuntu-22.04
    timeout-minutes: 60 # budget with a warm cache: 40 min (WI-0.030 acceptance test 2)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/setup-ovt
        with:
          preset: linux-x64-release
          triplet: x64-linux-ovt
          qt: "true" # ovt_studio and its --self-test CTest test (WI-0.019)

      # configure, build and the linux-x64-release test preset; JUnit at build/linux-x64-release/junit.xml.
      # The `pr` lane preset is bound to linux-x64-debug (§13.2.4), which this job does not build; the release
      # test preset runs a superset of the pr lane on the tree that is shipped (§13.7.1).
      - name: Configure, build, test
        run: cmake --workflow --preset ci-linux-x64

      - name: Package
        run: |
          mkdir -p dist/ovt-linux-x64
          cp build/linux-x64-release/cli/ovt dist/ovt-linux-x64/
          tar -C dist -cf - ovt-linux-x64 | zstd -19 -q -o dist/ovt-linux-x64.tar.zst

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-linux-x64
          path: build/linux-x64-release/junit.xml
          if-no-files-found: warn

      - name: Upload build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ovt-linux-x64
          path: dist/ovt-linux-x64.tar.zst

  build-macos-arm64:
    # The owner's Mac Mini (self-hosted runner) instead of the GitHub macos-15 image (§13.7.1): the private
    # repository's hosted macOS minutes are scarce and the Mini is the macOS reference build host.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macos-arm64]
    timeout-minutes: 90
    env:
      # The Mini's 3 runners share 10 cores: 3 jobs each keeps the machine at about its core count.
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
      VCPKG_MAX_CONCURRENCY: "3"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/setup-ovt
        with:
          preset: macos-arm64-release
          triplet: arm64-osx-ovt
          qt: "true" # ovt_studio and its --self-test CTest test (WI-0.019)

      - name: Configure, build, test
        run: cmake --workflow --preset ci-macos-arm64 # JUnit at build/macos-arm64-release/junit.xml

      - name: pr lane
        run: tools/ctest.sh pr macos-arm64-release # ctest --preset pr-macos; JUnit at build/pr-macos/junit.xml

      - name: Ad-hoc sign, bundle and smoke test
        run: |
          mkdir -p dist/ovt-macos-arm64
          cp build/macos-arm64-release/cli/ovt dist/ovt-macos-arm64/
          app="$(find build/macos-arm64-release -maxdepth 3 -name 'OVT Studio.app' -type d | head -n 1)"
          if [ -n "$app" ]; then
            ditto "$app" "dist/ovt-macos-arm64/OVT Studio.app"
          else
            echo "::error::OVT Studio.app was not built (is Qt missing? OVT_BUILD_GUI turns off without it)"
            exit 1
          fi
          for item in dist/ovt-macos-arm64/*; do codesign --force --deep --sign - "$item"; done
          dist/ovt-macos-arm64/ovt --version
          if [ -x tools/mac/smoke.sh ]; then tools/mac/smoke.sh "dist/ovt-macos-arm64/OVT Studio.app"; fi
          (cd dist && ditto -c -k --keepParent ovt-macos-arm64 ovt-macos-arm64.zip)

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-macos-arm64
          path: |
            build/macos-arm64-release/junit.xml
            build/pr-macos/junit.xml
          if-no-files-found: warn

      # Karl downloads main builds to his MacBook with `gh run download -n ovt-macos-arm64`.
      - name: Upload build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ovt-macos-arm64
          path: dist/ovt-macos-arm64.zip
          retention-days: 30
