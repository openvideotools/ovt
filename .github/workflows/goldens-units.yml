#
# Elementary-stream unit goldens (chapter 14 WI-1.570): runs tools/goldens/gen_units.py inside the oracle image
# (ghcr.io/openvideotools/ovt-oracles:main, chapter 14 §14.2.6) over the `fast` Annex B and IVF corpora (plus
# jvt_CABA3_TOSHIBA_E) and uploads tests/golden/{h264,h265,av1}/<id>.ovt-units.json + units-index.json as the artifact
# `goldens-units`. Run twice; the two outputs must be byte-identical (chapter 0 §0.7.5). The workflow never writes to
# the repository: goldens are committed by hand from the artifact.
name: goldens-units

on:
  pull_request:
    paths:
      - "tools/goldens/gen_units.py"
      - "tools/ref_annexb.py"
      - ".github/workflows/goldens-units.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/openvideotools/ovt-oracles:main

jobs:
  generate:
    if: vars.OVT_HOSTED_RUNNERS != 'off' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read # pull the private oracle image
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: corpora cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/corpora
          key: goldens-units-corpora-${{ hashFiles('tests/corpora/manifest.json') }}
          restore-keys: goldens-units-corpora-

      - name: fetcher dependencies
        run: python3 -m pip install -r tools/requirements.txt

      - name: fetch the fast Annex B and IVF corpora (verified against the manifest hashes)
        run: |
          python3 -I tools/fetch_corpora.py --tags fast --cache-dir "${RUNNER_TEMP}/corpora" --retries 4 \
            --sources jvt,jctvc,aom
          python3 -I tools/fetch_corpora.py --ids jvt_CABA3_TOSHIBA_E --cache-dir "${RUNNER_TEMP}/corpora" --retries 4

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: generate the goldens twice in the oracle image
        run: |
          docker pull "${IMAGE}"
          for n in 1 2; do
            mkdir -p "${RUNNER_TEMP}/out${n}"
            docker run --rm --user "$(id -u):$(id -g)" -v "${PWD}:/repo:ro" -v "${RUNNER_TEMP}/corpora:/corpora:ro" \
              -v "${RUNNER_TEMP}/out${n}:/out" -w /repo -e HOME=/tmp "${IMAGE}" \
              python3 -I tools/goldens/gen_units.py --out /out --corpora-dir /corpora
          done

      - name: the two runs are byte-identical
        run: diff -r "${RUNNER_TEMP}/out1" "${RUNNER_TEMP}/out2"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: goldens-units
          path: ${{ runner.temp }}/out1
          retention-days: 14
