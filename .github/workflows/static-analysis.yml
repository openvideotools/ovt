#
# Static analysis (chapter 14 §14.8.2-14.8.4, WI-0.559; file named by chapter 13 §13.7.1):
#   clang-tidy  PR: changed lines only (clang-tidy-diff); nightly: whole tree, warnings as errors.
#               Also runs tools/check_ovt_flags.py (every OVT target links ovt::flags).
#   cppcheck    nightly, non-blocking, findings uploaded as an artefact.
# The -Werror warning set itself is the ovt::flags target (chapter 13 §13.2.5); the CI presets build with
# OVT_WERROR=ON in build-linux-x64 / build-macos-arm64, not here.
# Third-party actions are pinned by commit SHA, never by tag.
#
# Runners: clang-tidy runs on the owner's Mac Mini (self-hosted, label macos-arm64) with Homebrew llvm@19 (the
# same LLVM major as the clang-format pin) on the macos-arm64-debug compilation database; never for fork pull
# requests. cppcheck needs Linux and skips when the repository variable OVT_HOSTED_RUNNERS is `off` (ci.yml).
name: static-analysis

on:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PRESET: macos-arm64-debug
  LLVM: /opt/homebrew/opt/llvm@19 # brew install llvm@19 (keg-only; never on PATH)
  # Directories that hold OVT code (header filter of .clang-tidy); third_party is never analysed.
  OVT_DIRS: core render plugins cli app

jobs:
  clang-tidy:
    # Never run a fork's code on the Mini.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macos-arm64]
    timeout-minutes: 60 # the PR run on changed lines must stay under 10 minutes once the build cache is warm
    env:
      # The Mini's 3 runners share 10 cores: 3 jobs each keeps the machine at about its core count.
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
      VCPKG_MAX_CONCURRENCY: "3"
      JOBS: "3"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # the PR diff against the base commit

      # Decide first, with only the checkout: a PR that changes neither C/C++ nor the CMake files skips the
      # setup and the build (CI minutes on the Free plan).
      - name: What changed
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          specs=()
          for d in $OVT_DIRS; do
            for ext in cpp cc h hpp; do specs+=(":(glob)$d/**/*.$ext"); done
          done
          git diff -U0 "$BASE" HEAD -- "${specs[@]}" > "$RUNNER_TEMP/pr.diff"
          cmake_changed="$(git diff --name-only "$BASE" HEAD -- ':(glob)**/CMakeLists.txt' 'cmake' CMakePresets.json tools/check_ovt_flags.py | wc -l)"
          if [ -s "$RUNNER_TEMP/pr.diff" ] || [ "$cmake_changed" -gt 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no C/C++ or CMake changes; clang-tidy skipped"
          fi

      - uses: ./.github/actions/setup-ovt
        if: steps.diff.outputs.run == 'true'
        with:
          preset: macos-arm64-debug
          triplet: arm64-osx-ovt
          qt: "true" # app/ sources need Qt in the compilation database (WI-0.019)

      # The compilation database comes from AppleClang; Homebrew's clang-tidy needs the SDK named explicitly.
      - name: clang-tidy
        if: steps.diff.outputs.run == 'true'
        run: |
          if [ ! -x "$LLVM/bin/clang-tidy" ]; then
            echo "::error::$LLVM/bin/clang-tidy is missing on this runner (brew install llvm@19)"
            exit 1
          fi
          "$LLVM/bin/clang-tidy" --version
          echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Configure
        if: steps.diff.outputs.run == 'true'
        run: cmake --preset "$PRESET"

      # The configure step is enough for the file API reply.
      - name: Every OVT target links ovt::flags
        if: steps.diff.outputs.run == 'true'
        run: python -I tools/check_ovt_flags.py --build-dir "build/$PRESET"

      # Build once: the generated sources (FlatBuffers headers) that clang-tidy needs.
      - name: Build
        if: steps.diff.outputs.run == 'true'
        run: cmake --build --preset "$PRESET"

      # -Wno-unknown-warning-option: AppleClang and LLVM 19 do not know the same warning flags; under
      # OVT_WERROR=ON an unknown one would be an error.
      - name: clang-tidy on the changed lines
        if: github.event_name == 'pull_request' && steps.diff.outputs.run == 'true'
        run: |
          if [ ! -s "$RUNNER_TEMP/pr.diff" ]; then echo "no C/C++ changes"; exit 0; fi
          diff_tool="$LLVM/share/clang/clang-tidy-diff.py"
          test -f "$diff_tool"
          python3 "$diff_tool" -p1 -path "build/$PRESET" -quiet -j "$JOBS" -clang-tidy-binary "$LLVM/bin/clang-tidy" \
            -extra-arg=-Wno-unknown-warning-option -extra-arg="-isysroot$SDKROOT" < "$RUNNER_TEMP/pr.diff" | tee "$RUNNER_TEMP/tidy.txt"
          # clang-tidy-diff exits 0 on findings unless warnings-as-errors fires, so fail on any finding.
          if grep -E '^[^ ]+:[0-9]+:[0-9]+: (warning|error):' "$RUNNER_TEMP/tidy.txt"; then
            echo "::error::clang-tidy findings on the changed lines"
            exit 1
          fi

      - name: clang-tidy on the whole tree
        if: github.event_name != 'pull_request'
        run: |
          # Fail on any finding, as the PR job does.
          "$LLVM/bin/run-clang-tidy" -p "build/$PRESET" -quiet -j "$JOBS" -clang-tidy-binary "$LLVM/bin/clang-tidy" \
            -extra-arg=-Wno-unknown-warning-option -extra-arg="-isysroot$SDKROOT" \
            "^$PWD/($(echo "$OVT_DIRS" | tr ' ' '|'))/.*\.(cpp|cc)$" | tee "$RUNNER_TEMP/tidy-all.txt" || true
          if grep -E '^[^ ]+:[0-9]+:[0-9]+: (warning|error):' "$RUNNER_TEMP/tidy-all.txt"; then
            echo "::error::clang-tidy findings in the whole tree"
            exit 1
          fi

  cppcheck:
    # Non-blocking and nightly only (§14.8.4): it becomes a PR check only if the owner decides so.
    if: github.event_name != 'pull_request' && vars.OVT_HOSTED_RUNNERS != 'off'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    continue-on-error: true
    env:
      PRESET: linux-x64-debug
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/setup-ovt
        with:
          preset: linux-x64-debug
          triplet: x64-linux-ovt
          qt: "true" # app/ sources need Qt in the compilation database (WI-0.019)

      - name: Configure
        run: |
          sudo apt-get install -y -q --no-install-recommends cppcheck
          cmake --preset "$PRESET"

      - name: cppcheck
        run: |
          mkdir -p cppcheck-report
          # Qt's AUTOMOC/AUTORCC sources (<target>_autogen/mocs_compilation.cpp and friends) are listed in the
          # compilation database but are not generated by the configure step, so cppcheck cannot open them. Drop
          # exactly those entries; every real source stays.
          python3 -I - "build/$PRESET/compile_commands.json" cppcheck-report/compile_commands.json <<'PY'
          import json, sys
          entries = json.load(open(sys.argv[1]))
          kept = [e for e in entries if "_autogen/" not in e["file"].replace("\\", "/")]
          print(f"compile_commands: kept {len(kept)} of {len(entries)} entries")
          json.dump(kept, open(sys.argv[2], "w"), indent=1)
          PY
          # Only OVT translation units: third_party and generated files are filtered out of the project.
          cppcheck --enable=warning,performance,portability --std=c++20 --inline-suppr \
            --project=cppcheck-report/compile_commands.json \
            --suppressions-list=tests/cppcheck.supp \
            -i third_party -i build \
            --xml --xml-version=2 -j "$(nproc)" 2> cppcheck-report/cppcheck.xml

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cppcheck-report
          path: cppcheck-report/cppcheck.xml
          if-no-files-found: warn
