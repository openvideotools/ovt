#
# AV1 oracle goldens (chapter 14 §14.4.5, WI-0.566): runs tools/goldens/gen_av1.py inside the oracle image
# (ghcr.io/openvideotools/ovt-oracles:main, chapter 14 §14.2.6) over the `fast` aom corpora and the syn_av1_* streams
# and uploads tests/golden/av1 + av1-index.json as the artifact `goldens-av1`. Run twice; the two outputs must be
# byte-identical (chapter 0 §0.7.5). The workflow never writes to the repository: goldens are committed by hand from
# the artifact.
#   pull_request   when the generator, the normalisers or this file change (same-repo branches only: the image is private)
#   workflow_dispatch
name: goldens-av1

on:
  pull_request:
    paths:
      - "tools/goldens/gen_av1.py"
      - "tools/goldens/av1_selfcheck.py"
      - "tools/goldens/av1_skips.json"
      - "tests/oracles/normalize/aom_inspect*"
      - "tests/oracles/normalize/canon.py"
      - ".github/workflows/goldens-av1.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/openvideotools/ovt-oracles:main

jobs:
  generate:
    if: vars.OVT_HOSTED_RUNNERS != 'off' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read # pull the private oracle image
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: corpora cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/corpora
          key: goldens-av1-corpora-${{ hashFiles('tests/corpora/manifest.json') }}
          restore-keys: goldens-av1-corpora-

      - name: fetcher dependencies
        run: python3 -m pip install -r tools/requirements.txt

      - name: fetch the fast aom corpora (verified against the manifest hashes)
        run: |
          python3 -I tools/fetch_corpora.py --tags fast --cache-dir "${RUNNER_TEMP}/corpora" --retries 4 \
            --sources aom

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: generate the goldens twice in the oracle image
        run: |
          docker pull "${IMAGE}"
          mkdir -p "${RUNNER_TEMP}/out1" "${RUNNER_TEMP}/out2"
          rc=0
          for n in 1 2; do
            # The cache dir also receives the syn_* streams that generate.py makes in the image (same layout as a
            # fetched corpus). The status of the last run is checked below.
            docker run --rm --user "$(id -u):$(id -g)" -v "${PWD}:/repo:ro" -v "${RUNNER_TEMP}/corpora:/corpora" \
              -v "${RUNNER_TEMP}/out${n}:/out" -w /repo -e HOME=/tmp "${IMAGE}" \
              python3 -I tools/goldens/gen_av1.py --out /out --corpora-dir /corpora --generate-syn --jobs 4 \
              --work-dir /tmp/work || rc=$?
          done
          echo "generator exit status ${rc}"
          echo "rc=${rc}" >> "${GITHUB_ENV}"

      - name: the two runs are byte-identical
        run: diff -r "${RUNNER_TEMP}/out1" "${RUNNER_TEMP}/out2"

      - name: committed goldens are what the generator writes
        run: |
          # Every golden committed under tests/golden/av1 must be byte-identical to the one just generated.
          if [ -d tests/golden/av1 ]; then
            for f in tests/golden/av1/*.gz; do cmp "$f" "${RUNNER_TEMP}/out1/av1/$(basename "$f")"; done
          fi
          if [ -f tests/golden/av1-index.json ]; then cmp tests/golden/av1-index.json "${RUNNER_TEMP}/out1/av1-index.json"; fi

      - name: print the index and the generated syn_* goldens (to commit by hand without the artifact)
        if: always()
        run: |
          cat "${RUNNER_TEMP}/out1/av1-index.json" || true
          for f in "${RUNNER_TEMP}"/out1/av1/syn_*; do [ -f "$f" ] && { echo "== $(basename "$f")"; base64 -w0 "$f"; echo; }; done || true

      - name: summary
        if: always()
        run: |
          python3 -I - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json, os, pathlib
          idx = pathlib.Path(os.environ["RUNNER_TEMP"], "out1", "av1-index.json")
          if not idx.is_file():
              raise SystemExit
          doc = json.loads(idx.read_text())
          print("| id | goldens | failed | skipped | TUs / frames / hidden |\n|---|---|---|---|---|")
          for cid, e in doc["entries"].items():
              g = e["goldens"].get("aom-inspect", {})
              shape = f"{g['temporal_units']} / {g['frames']} / {g['hidden']}" if g else ""
              print(f"| {cid} | {len(e['goldens'])} | {e['failed'] or ''} | {e['skipped'] or ''} | {shape} |")
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: goldens-av1
          path: ${{ runner.temp }}/out1
          retention-days: 14

      - name: fail when a step failed or the self-check found a disagreement
        run: test "${rc:-1}" = 0
