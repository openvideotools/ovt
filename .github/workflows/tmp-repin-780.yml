#
# TEMPORARY (#780): re-pins the manifest hashes of every syn_* stream that libx265 produces (or derives from) after
# `info=0`, and regenerates their h265 goldens, both in the oracle image. Prints the manifest diff and uploads the
# result as an artifact. Removed again before the PR is merged.
name: tmp-repin-780

on:
  pull_request:
    paths:
      - ".github/workflows/tmp-repin-780.yml"

permissions:
  contents: read

env:
  IMAGE: ghcr.io/openvideotools/ovt-oracles:main

jobs:
  repin:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: hash the x265 syn streams twice and diff the manifest
        run: |
          docker pull "${IMAGE}"
          IDS=$(python3 -I - <<'PY'
          import sys
          sys.path.insert(0, "tests/corpora/synthetic")
          import generate as g
          doc = g.load_recipes(g.DEFAULT_RECIPES)
          recs = [r for r in doc["recipes"] if "id" in r]
          def uses(r):
              return any(a[0] == "x265" or "libx265" in a
                         for st in r["steps"] for a in ([st["cmd"]] if "cmd" in st else st.get("pipe", [])))
          direct = {r["id"] for r in recs if uses(r)}
          ids = [r["id"] for r in recs if not r.get("local_only")
                 and {x["id"] for x in g.closure(doc, [r["id"]]) if "id" in x} & direct]
          print(",".join(ids))
          PY
          )
          echo "ids: ${IDS}"
          for n in 1 2; do
            rm -rf "${RUNNER_TEMP}/repo${n}"; cp -r "${PWD}" "${RUNNER_TEMP}/repo${n}"
            mkdir -p "${RUNNER_TEMP}/syn${n}"
            docker run --rm --user "$(id -u):$(id -g)" -v "${RUNNER_TEMP}/repo${n}:/repo" -v "${RUNNER_TEMP}/syn${n}:/out" \
              -w /repo -e HOME=/tmp "${IMAGE}" \
              python3 -I tests/corpora/synthetic/generate.py --out /out --only "${IDS}" --update-manifest
          done
          diff "${RUNNER_TEMP}/repo1/tests/corpora/manifest.json" "${RUNNER_TEMP}/repo2/tests/corpora/manifest.json"
          echo "two runs agree"
          diff -u tests/corpora/manifest.json "${RUNNER_TEMP}/repo1/tests/corpora/manifest.json" > "${RUNNER_TEMP}/manifest.patch" || true
          echo "===== manifest.patch"; cat "${RUNNER_TEMP}/manifest.patch"; echo "===== end"

      - name: regenerate the h265 goldens of those streams (twice, byte-identical)
        run: |
          IDS=$(python3 -I - <<'PY'
          import json
          m = json.load(open("tests/golden/h26x-index.json"))["entries"]
          print(",".join(k for k in m if k.startswith("syn_h265_") and k not in ("syn_h265_bpyramid", "syn_h265_crop_1080_in_1088")))
          PY
          )
          for n in 1 2; do
            mkdir -p "${RUNNER_TEMP}/out${n}"; cp tests/golden/h26x-index.json "${RUNNER_TEMP}/out${n}/"
            docker run --rm --user "$(id -u):$(id -g)" -v "${RUNNER_TEMP}/repo1:/repo:ro" -v "${RUNNER_TEMP}/syn1:/corpora" \
              -v "${RUNNER_TEMP}/out${n}:/out" -w /repo -e HOME=/tmp "${IMAGE}" \
              python3 -I tools/goldens/gen_h26x.py --out /out --corpora-dir /corpora --only "${IDS}" --jobs 4 \
              --work-dir /tmp/work --known tests/golden/KNOWN_DIFFS.md
          done
          diff -r "${RUNNER_TEMP}/out1" "${RUNNER_TEMP}/out2"
          cp "${RUNNER_TEMP}/manifest.patch" "${RUNNER_TEMP}/out1/"
          diff -u tests/golden/h26x-index.json "${RUNNER_TEMP}/out1/h26x-index.json" > "${RUNNER_TEMP}/index.patch" || true
          echo "===== PRINT manifest.patch"; base64 -w0 "${RUNNER_TEMP}/manifest.patch"; echo
          echo "===== PRINT index.patch"; base64 -w0 "${RUNNER_TEMP}/index.patch"; echo
          for f in "${RUNNER_TEMP}"/out1/h265/syn_*; do echo "===== PRINT h265/$(basename "$f")"; base64 -w0 "$f"; echo; done
          echo "===== PRINT end"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: repin-780
          path: ${{ runner.temp }}/out1
          retention-days: 7
