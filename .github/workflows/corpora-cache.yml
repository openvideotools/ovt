#
# corpora-cache (chapter 13 §13.7.1, #611): keep the `fast` test corpora in the Actions cache on refs/heads/main,
# the one scope every branch and pull request can restore from. The build jobs' setup-ovt action only restores
# the corpora (a cache saved by a pull_request run is visible to that PR alone); main runs of ci.yml also save,
# but those are often replaced by newer pushes before they reach the fetch, so this small job is the reliable
# producer.
# The key is the one setup-ovt restores (corpora-fast-Linux-<manifest hash>). When it already exists the job ends
# after the lookup; otherwise it restores the newest stale prefix, fetches what is missing and saves.
# The `all` set (nightly) is saved by nightly.yml's own setup-ovt step, which runs on main.
# SPEC-ASSUMPTION(#612): chapter 13 §13.7.1 has this job fetch every manifest entry; it refreshes the `fast` set,
# the one the PR jobs restore.
# Third-party actions are pinned by commit SHA, never by tag.
name: corpora-cache

on:
  push:
    branches: [main]
    paths:
      - "tests/corpora/manifest.json"
      - "tools/fetch_corpora.py"
      - ".github/workflows/corpora-cache.yml"
  schedule:
    - cron: "17 5 * * 1" # weekly (chapter 13 §13.7.1); Monday 05:17 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  corpora-cache:
    if: vars.OVT_HOSTED_RUNNERS != 'off' # the owner's switch (ci.yml header)
    runs-on: ubuntu-22.04 # the OS of build-linux-x64, whose ffmpeg post steps the cached files must match
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Look up the cache
        id: lookup
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: build/corpora
          key: corpora-fast-${{ runner.os }}-${{ hashFiles('tests/corpora/manifest.json') }}
          lookup-only: true

      - name: Restore a stale prefix
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: build/corpora
          key: ${{ steps.lookup.outputs.cache-primary-key }}
          restore-keys: corpora-fast-${{ runner.os }}-

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.lookup.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"

      - name: Fetch the fast corpora
        if: steps.lookup.outputs.cache-hit != 'true'
        run: |
          # The same tools and command as setup-ovt's "Fetch corpora": the archive's ffmpeg runs the post steps
          # (wrap_y4m, ffmpeg_trim_seconds) and jsonschema (tools/requirements.txt) validates the manifest.
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg
          python -m pip install --quiet -r tools/requirements.txt
          mkdir -p build/corpora
          fast="--tags fast --max-total-bytes 314572800"
          # shellcheck disable=SC2086
          python -I tools/fetch_corpora.py --cache-dir build/corpora $fast --retries 6
          # shellcheck disable=SC2086
          python -I tools/fetch_corpora.py --cache-dir build/corpora $fast --verify-only

      - name: Save
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: build/corpora
          key: ${{ steps.lookup.outputs.cache-primary-key }}
