#
# Nightly jobs (chapter 13 §13.7.1): tsan, macos-asan, the coverage run (WI-0.031) and the corpora jobs (WI-0.552c). Later work items add the long fuzz lane
# (WI-0.033), distro packaging (WI-0.073) and others to this file.
# Third-party actions are pinned by commit SHA, never by tag.
#
# Runners: macos-asan runs on the owner's Mac Mini (self-hosted, label macos-arm64). Scheduled and manual runs
# only, so no fork code ever reaches it. tsan needs Linux and skips when the repository variable
# OVT_HOSTED_RUNNERS is `off` (see ci.yml).
name: nightly

on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tsan:
    if: vars.OVT_HOSTED_RUNNERS != 'off'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/setup-ovt
        with:
          preset: linux-x64-tsan
          triplet: x64-linux-ovt

      - name: Clang 16
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          sudo bash "$RUNNER_TEMP/llvm.sh" 16

      - name: Configure and build
        run: |
          cmake --preset linux-x64-tsan
          cmake --build --preset linux-x64-tsan

      # The multi-threaded modules only (chapter 13 §13.7.1); the test preset sets TSAN_OPTIONS.
      - name: Test jobs, cache and analysis under ThreadSanitizer
        run: ctest --preset linux-x64-tsan -L "jobs|cache|analysis"

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-tsan
          path: build/linux-x64-tsan/junit.xml
          if-no-files-found: warn

  # Distro packaging skeletons (chapter 13 §13.6.3, WI-0.072). Off until the skeletons can build end to end:
  # set the repository variable OVT_PACKAGING_NIGHTLY to `on`. Why off: Ubuntu 22.04 does not ship the pinned
  # libplacebo/libvmaf, and ovt-studio, the Python module and the packaging install rules are not in the tree yet
  # (see docs/dev/packaging.md "Status"). The Fedora freeworld spec is never built here (RPM Fusion, patents).
  # Container images are pinned by digest; the bump is a reviewed PR.
  package-deb:
    if: vars.OVT_HOSTED_RUNNERS != 'off' && vars.OVT_PACKAGING_NIGHTLY == 'on'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    container:
      image: ubuntu:22.04@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential devscripts equivs lintian
          cp -a packaging/debian debian
          mk-build-deps --install --remove --tool 'apt-get -y --no-install-recommends' debian/control

      - name: dpkg-buildpackage
        run: dpkg-buildpackage -us -uc -b

      - name: lintian (errors fail the job)
        run: lintian --fail-on error --display-info ../*.changes

  package-rpm:
    if: vars.OVT_HOSTED_RUNNERS != 'off' && vars.OVT_PACKAGING_NIGHTLY == 'on'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    container:
      image: fedora:41@sha256:f1a3fab47bcb3c3ddf3135d5ee7ba8b7b25f2e809a47440936212a3a50957f3d
    steps:
      - name: Tools
        run: dnf install -y rpm-build rpmdevtools dnf-plugins-core git tar gzip

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Source tarball and build dependencies
        run: |
          v=$(cat VERSION)
          rpmdev-setuptree
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git archive --prefix="ovt-$v/" -o ~/rpmbuild/SOURCES/ovt-$v.tar.gz HEAD
          dnf builddep -y packaging/rpm/ovt.spec

      - name: rpmbuild (ovt only; the freeworld spec is not built in CI)
        run: rpmbuild -ba packaging/rpm/ovt.spec

  macos-asan:
    runs-on: [self-hosted, macos-arm64]
    timeout-minutes: 90
    env:
      # The Mini's 3 runners share 10 cores: 3 jobs each keeps the machine at about its core count.
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
      VCPKG_MAX_CONCURRENCY: "3"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/setup-ovt
        with:
          preset: macos-arm64-asan
          triplet: arm64-osx-ovt

      - name: Configure, build, test (sanitizers)
        run: cmake --workflow --preset ci-macos-asan # ctest --preset sanitizers-macos

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-macos-asan
          path: build/sanitizers-macos/junit.xml
          if-no-files-found: warn

  coverage:
    # Also on pushes to main (ci.yml); not on pull requests, the Mini is CPU-bound.
    runs-on: [self-hosted, macos-arm64]
    timeout-minutes: 60
    env:
      # The Mini's 3 runners share 10 cores: 3 jobs each keeps the machine at about its core count.
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
      VCPKG_MAX_CONCURRENCY: "3"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/coverage

  # Every manifest entry fetched, every test that needs a corpus or is `slow` run, and OVT_REQUIRE_CORPORA=1 so a
  # stream that is missing fails the test instead of skipping it (chapter 14 §14.2.4, §14.2.5). Entries the
  # fetcher cannot download (manual download, hash pending) are logged as skipped, so a test that cites one fails
  # here: that is the signal to finish the entry.
  corpora-macos:
    # After the other two Mini jobs: at most 2 macOS builds at once on the Mini (3 runners share 10 cores). After
    # corpora-linux too, which generates the syn_* streams this job restores (it still runs when that job is skipped).
    needs: [macos-asan, coverage, corpora-linux]
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, macos-arm64]
    timeout-minutes: 120
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
      VCPKG_MAX_CONCURRENCY: "3"
      OVT_REQUIRE_CORPORA: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/setup-ovt
        with:
          preset: macos-arm64-release
          triplet: arm64-osx-ovt
          corpora: all

      # Generated by corpora-linux in the oracle image (same key); a miss leaves the syn_* tests to fail.
      - name: Restore the generated syn_* streams
        id: syn-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: build/syn
          key: syn-${{ hashFiles('tests/corpora/synthetic/**', 'tests/corpora/manifest.json') }}
          enableCrossOsArchive: true

      - name: Add the generated syn_* streams to the corpora
        run: |
          if [ "${{ steps.syn-cache.outputs.cache-hit }}" = "true" ]; then
            cp -R build/syn/. build/corpora/
          else
            echo "::warning::no generated syn_* streams in the cache (corpora-linux did not save them)"
          fi

      - name: Configure and build
        run: |
          cmake --preset macos-arm64-release
          cmake --build --preset macos-arm64-release

      # needs_corpus_demo is the deliberate missing-corpus demo of WI-0.550 (fails by design under OVT_REQUIRE_CORPORA).
      - name: Corpus and slow tests
        run: ctest --test-dir build/macos-arm64-release -L "needs_corpus|slow" -LE needs_corpus_demo -j 4 --output-on-failure --output-junit junit-corpora.xml

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-corpora-macos
          path: build/macos-arm64-release/junit-corpora.xml
          if-no-files-found: warn

  # The syn_* streams are not downloadable: tests/corpora/synthetic/generate.py makes them with the pinned encoders
  # of the oracle image (chapter 14 §14.3.3), as the goldens workflows do. This job generates them and keeps them in
  # a cross-OS cache that corpora-macos restores (the Mini has no Docker). packages: read pulls the private image.
  corpora-linux:
    if: vars.OVT_HOSTED_RUNNERS != 'off'
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
    env:
      OVT_REQUIRE_CORPORA: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/setup-ovt
        with:
          preset: linux-x64-release
          triplet: x64-linux-ovt
          corpora: all

      - name: Restore the generated syn_* streams
        id: syn-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: build/syn
          key: syn-${{ hashFiles('tests/corpora/synthetic/**', 'tests/corpora/manifest.json') }}
          enableCrossOsArchive: true

      - if: steps.syn-cache.outputs.cache-hit != 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Into the fetched cache dir, because some recipes take a fetched corpus as input ({corpus:ID}). A recipe that
      # fails is reported here and its stream stays missing, so the tests that cite it fail below.
      - name: Generate the syn_* streams in the oracle image
        id: syn-generate
        if: steps.syn-cache.outputs.cache-hit != 'true'
        env:
          IMAGE: ghcr.io/openvideotools/ovt-oracles:main
        run: |
          docker pull "${IMAGE}"
          rc=0
          docker run --rm --user "$(id -u):$(id -g)" -v "${PWD}:/repo:ro" -v "${PWD}/build/corpora:/corpora" -w /repo \
            -e HOME=/tmp "${IMAGE}" python3 -I tests/corpora/synthetic/generate.py --out /corpora || rc=$?
          rm -rf build/corpora/.work build/syn
          mkdir -p build/syn
          for d in build/corpora/syn_*; do
            if [ -f "${d}/.ok" ]; then cp -R "${d}" build/syn/; fi
          done
          echo "generated $(find build/syn -mindepth 1 -maxdepth 1 | wc -l) syn entries (generate.py exit ${rc})"
          if [ "${rc}" != 0 ]; then echo "::warning::generate.py exited ${rc}; the cache is not saved"; fi
          echo "rc=${rc}" >> "${GITHUB_OUTPUT}"

      - name: Save the generated syn_* streams
        if: steps.syn-cache.outputs.cache-hit != 'true' && steps.syn-generate.outputs.rc == '0'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: build/syn
          key: ${{ steps.syn-cache.outputs.cache-primary-key }}
          enableCrossOsArchive: true

      - name: Add the cached syn_* streams to the corpora
        if: steps.syn-cache.outputs.cache-hit == 'true'
        run: cp -R build/syn/. build/corpora/

      - name: Configure and build
        run: |
          cmake --preset linux-x64-release
          cmake --build --preset linux-x64-release

      # needs_corpus_demo is the deliberate missing-corpus demo of WI-0.550 (fails by design under OVT_REQUIRE_CORPORA).
      - name: Corpus and slow tests
        run: ctest --test-dir build/linux-x64-release -L "needs_corpus|slow" -LE needs_corpus_demo -j 4 --output-on-failure --output-junit junit-corpora.xml

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-corpora-linux
          path: build/linux-x64-release/junit-corpora.xml
          if-no-files-found: warn
