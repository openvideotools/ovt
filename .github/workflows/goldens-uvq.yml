#
# UVQ oracle goldens (chapter 14 §14.4.14, WI-0.565b): runs tools/goldens/gen_uvq.py inside the oracle image
# (ghcr.io/openvideotools/ovt-oracles:main, chapter 14 §14.2.6) over the three ytugc `fast` clips (UVQ 1.5 and 1.0, CPU,
# one thread) and uploads the goldens and uvq-index.json as the artifact `goldens-uvq`. Run twice; the two outputs must be byte-identical (chapter 0 §0.7.5). The workflow never writes
# to the repository: goldens are committed by hand from the artifact.
#   pull_request   when the generator, the oracle program, the normalisers, the RD point sets or this file change
#                  (same-repo branches only: the image is private)
#   workflow_dispatch
name: goldens-uvq

on:
  pull_request:
    paths:
      - "tools/goldens/gen_uvq.py"
      - "tests/oracles/normalize/**"
      - ".github/workflows/goldens-uvq.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/openvideotools/ovt-oracles:main

jobs:
  generate:
    if: vars.OVT_HOSTED_RUNNERS != 'off' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read # pull the private oracle image
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: corpora cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/corpora
          key: goldens-uvq-corpora-${{ hashFiles('tests/corpora/manifest.json') }}
          restore-keys: goldens-uvq-corpora-

      - name: fetcher dependencies
        run: python3 -m pip install -r tools/requirements.txt

      - name: fetch the ytugc fast clips (verified against the manifest hashes)
        run: |
          python3 -I tools/fetch_corpora.py --ids ytugc_clip01,ytugc_clip02,ytugc_clip03 --cache-dir "${RUNNER_TEMP}/corpora" --retries 4

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: generate the goldens twice in the oracle image
        run: |
          docker pull "${IMAGE}"
          mkdir -p "${RUNNER_TEMP}/out1" "${RUNNER_TEMP}/out2"
          rc=0
          for n in 1 2; do
            # The status of the last run is checked below.
            docker run --rm --user "$(id -u):$(id -g)" -v "${PWD}:/repo:ro" -v "${RUNNER_TEMP}/corpora:/corpora" \
              -v "${RUNNER_TEMP}/out${n}:/out" -w /repo -e HOME=/tmp "${IMAGE}" \
              python3 -I tools/goldens/gen_uvq.py --out /out --corpora-dir /corpora \
              --work-dir /tmp/work || rc=$?
          done
          echo "generator exit status ${rc}"
          echo "rc=${rc}" >> "${GITHUB_ENV}"

      - name: the two runs are byte-identical
        run: diff -r "${RUNNER_TEMP}/out1" "${RUNNER_TEMP}/out2"

      - name: summary
        if: always()
        run: |
          python3 -I - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json, os, pathlib
          idx = pathlib.Path(os.environ["RUNNER_TEMP"], "out1", "uvq-index.json")
          if not idx.is_file():
              raise SystemExit
          doc = json.loads(idx.read_text())
          print("| clip | goldens | failed |\n|---|---|---|")
          for cid, e in doc["clips"].items():
              print(f"| {cid} | {len(e['goldens'])} | {e['failed'] or ''} |")
          print("\n```json\n" + json.dumps({k: v for k, v in doc.items() if k != "clips"}, indent=1) + "\n```")
          PY

      - name: print the index (the artifact store is not reachable from every sandbox)
        if: always()
        run: cat "${RUNNER_TEMP}/out1/uvq-index.json" || true

      - name: TEMPORARY dump of the goldens into the log (removed before merge)
        if: always()
        run: |
          echo "BEGIN-GOLDENS-B64"
          tar -C "${RUNNER_TEMP}/out1" -cf - . | base64 -w0
          echo
          echo "END-GOLDENS-B64"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: goldens-uvq
          path: ${{ runner.temp }}/out1
          retention-days: 14

      - name: fail when a step or a check failed
        run: test "${rc:-1}" = 0
