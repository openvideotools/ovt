#
# Monthly proof that tools/bootstrap.sh sets up a fresh host (chapter 13 §13.7.1 row `bootstrap-check`,
# WI-0.006 acceptance tests 1 and 2). bootstrap.sh never runs sudo; it prints the install commands, which
# this job runs (`--print-install | sudo bash`) before running bootstrap.sh for real.
# Third-party actions are pinned by commit SHA.
name: bootstrap-check

on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:
  # Also on pull requests that change the bootstrap inputs, so a broken bootstrap is caught before the
  # monthly run (addition to the §13.7.1 row).
  pull_request:
    paths:
      - tools/bootstrap.sh
      - tools/bootstrap_android.sh
      - tools/apt-packages.txt
      - tools/brew-packages.txt
      - tools/requirements.txt
      - .github/workflows/bootstrap-check.yml

permissions:
  contents: read

jobs:
  ubuntu-22-04:
    name: bootstrap-check (ubuntu-22.04)
    runs-on: ubuntu-22.04
    container: ubuntu:22.04            # a fresh image: only git and sudo are added below
    timeout-minutes: 120
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Only git and sudo
        run: apt-get update && apt-get install -y --no-install-recommends git sudo ca-certificates
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Trust the checkout
        # The workspace is mounted from the host with another owner, so git refuses it ("dubious ownership").
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install what bootstrap.sh asks for
        run: |
          tools/bootstrap.sh --print-install | tee install.sh
          # sudo drops the job environment; without it tzdata waits for an answer on stdin
          sudo env DEBIAN_FRONTEND=noninteractive TZ=Etc/UTC bash -euxo pipefail install.sh
      - name: tools/bootstrap.sh --no-qt
        run: tools/bootstrap.sh --no-qt --no-corpora
      - name: Put the bootstrap .venv on PATH
        # ovt_tp_meson() (dav1d, WI-0.011) looks for meson and ninja on PATH; bootstrap.sh installs them in .venv.
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Configure and build linux-x64-debug
        env:
          CC: gcc-13                     # Ubuntu 22.04's default gcc is 11; bootstrap.sh installed gcc-13
          CXX: g++-13
        run: |
          cmake --preset linux-x64-debug
          cmake --build --preset linux-x64-debug

  macos-15:
    name: bootstrap-check (macos-15)
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install what bootstrap.sh asks for
        run: |
          tools/bootstrap.sh --print-install | tee install.sh
          bash -euxo pipefail install.sh
      - name: tools/bootstrap.sh --no-qt
        run: tools/bootstrap.sh --no-qt --no-corpora
      - name: Put the bootstrap .venv on PATH
        # ovt_tp_meson() (dav1d, WI-0.011) looks for meson and ninja on PATH; bootstrap.sh installs them in .venv.
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Configure and build macos-arm64-debug
        run: |
          cmake --preset macos-arm64-debug
          cmake --build --preset macos-arm64-debug
