# SPDX-FileCopyrightText: 2026 The Open Video Tools contributors
# SPDX-License-Identifier: LGPL-2.1-or-later
#
# Licensing of the files that cannot carry an SPDX header (REUSE specification 3.3; chapter 15 §15.1,
# FR-GEN-107; WI-0.600). Files with their own header keep it: the default precedence "closest" lets a
# header win over these annotations. Licence texts live in LICENSES/.
version = 1

# Documentation prose: CC-BY-SA-4.0. Code snippets inside the documents are BSD-2-Clause (docs/LICENSE.md).
[[annotations]]
path = ["**/*.md"]
SPDX-FileCopyrightText = "2026 The Open Video Tools contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# The specification is CC-BY-4.0 (owner decision on #20), so implementers can reuse its text without
# ShareAlike. Comes after the entry above: in REUSE.toml the last matching annotation applies.
[[annotations]]
path = ["docs/spec/**/*.md"]
SPDX-FileCopyrightText = "2026 The Open Video Tools contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# JSON has no comment syntax: presets, the vcpkg manifest, Renovate, corpora manifests, goldens and
# schemas. They are build and test inputs, licensed like tools/, tests/ and cmake/ (§15.1).
[[annotations]]
path = ["**/*.json", "**/*.json.gz", "**/*.jsonl"]
SPDX-FileCopyrightText = "2026 The Open Video Tools contributors"
SPDX-License-Identifier = "LGPL-2.1-or-later"

# Repository metadata and one-line data files.
[[annotations]]
path = ["VERSION", ".gitattributes", ".gitignore", ".gitmodules", "**/.gitkeep"]
SPDX-FileCopyrightText = "2026 The Open Video Tools contributors"
SPDX-License-Identifier = "LGPL-2.1-or-later"

# Golden outputs other than JSON (text dumps, CSV, compressed blobs) are test data (tests/ licence).
[[annotations]]
path = ["tests/golden/**", "core/tests/golden/**", "**/tests/data/**"]
SPDX-FileCopyrightText = "2026 The Open Video Tools contributors"
SPDX-License-Identifier = "LGPL-2.1-or-later"

# Generated sources get their header from the generator when it can write one; these entries cover the
# generated files that are committed or shipped without it (WI-0.601 notes).
[[annotations]]
path = ["core/**/*_generated.h", "core/include/ovt/schema/**"]
SPDX-FileCopyrightText = "2026 The Open Video Tools contributors"
SPDX-License-Identifier = "BSD-2-Clause"

# The FlatBuffers schemas are verbatim copies of the spec's fenced blocks (chapter 06 §6.3 ff., kept
# identical by tools/check_schema_in_spec.py), so they carry the spec's SPDX-License-Identifier line but no
# copyright line of their own; this entry supplies it (WI-0.080).
[[annotations]]
path = ["core/schema/*.fbs"]
SPDX-FileCopyrightText = "2026 The Open Video Tools contributors"
SPDX-License-Identifier = "BSD-2-Clause"

# Fuzz seeds and crash regressions are binary test inputs (WI-0.557): tests/ licence.
[[annotations]]
path = ["core/tests/fuzz/corpus/**", "core/tests/fuzz/regressions/**"]
SPDX-FileCopyrightText = "2026 The Open Video Tools contributors"
SPDX-License-Identifier = "LGPL-2.1-or-later"

[[annotations]]
path = ["app/**/Branding.qml"]
SPDX-FileCopyrightText = "2026 The Open Video Tools contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Binary assets of the application (icons, images, fonts); app/ and android/ are GPL-3.0-or-later.
[[annotations]]
path = ["app/**/*.png", "app/**/*.svg", "app/**/*.ico", "app/**/*.icns", "android/**/*.png", "android/**/*.webp",
        "android/**/*.svg"]
SPDX-FileCopyrightText = "2026 The Open Video Tools contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# libaom's PATENTS file (the AOM Patent License 1.0), shipped next to every binary of the aom plugin
# (§15.2, POL-PAT-6). Byte-identical to LICENSES/LicenseRef-AOM-Patent-License-1.0.txt and to the libaom
# archive's PATENTS (its SHA-256 is in the libaom row of third_party/VERSIONS.md).
# Until WI-2.155 this file is what makes the LicenseRef text "used" for REUSE (chapter 15 WI-0.600).
[[annotations]]
path = ["plugins/ovt-plugin-aom/PATENTS"]
SPDX-FileCopyrightText = "Alliance for Open Media"
SPDX-License-Identifier = "LicenseRef-AOM-Patent-License-1.0"

# Governance texts taken verbatim from elsewhere (WI-0.604). These come last so they win over the
# "**/*.md" entry above (in REUSE.toml the last matching annotation applies).
[[annotations]]
path = "DCO"
SPDX-FileCopyrightText = "2004, 2006 The Linux Foundation and its contributors"
SPDX-License-Identifier = "LicenseRef-DCO-verbatim"

[[annotations]]
path = "CODE_OF_CONDUCT.md"
SPDX-FileCopyrightText = "2014-2021 Coraline Ada Ehmke and the Contributor Covenant contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# Licence-gate test fixtures that cannot carry a header (plain-text VERSIONS.md look-alikes; WI-0.602).
[[annotations]]
path = ["tools/tests/fixtures/license_gate/*.txt"]
SPDX-FileCopyrightText = "2026 The Open Video Tools contributors"
SPDX-License-Identifier = "LGPL-2.1-or-later"

# Synthetic test patterns generated by tools/gen_hdr_patterns.py (WI-1.413); chapter 14 section 14.3.2 makes
# generated test patterns OVT-owned CC0.
[[annotations]]
path = ["tests/corpora/patterns/*.mp4", "tests/corpora/patterns/.gitignore"]
SPDX-FileCopyrightText = "2026 The Open Video Tools contributors"
SPDX-License-Identifier = "CC0-1.0"

# Inputs of the synthetic corpus recipes (WI-0.553; chapter 14 section 14.3.3) whose formats have no comment
# syntax: the Widevine pssh payload, x265's HDR10+ JSON and MP4Box's chapter list. Generated test inputs are CC0.
[[annotations]]
path = ["tests/corpora/synthetic/widevine_pssh.bin", "tests/corpora/synthetic/hdr10plus_metadata.json", "tests/corpora/synthetic/chapters.txt"]
SPDX-FileCopyrightText = "2026 The Open Video Tools contributors"
SPDX-License-Identifier = "CC0-1.0"

# Oracle output snippets for the normaliser tests (WI-0.555): captured or reconstructed oracle text kept
# byte-exact, so no header line inside them.
[[annotations]]
path = ["tools/tests/fixtures/oracles/**"]
SPDX-FileCopyrightText = "2026 The Open Video Tools contributors"
SPDX-License-Identifier = "LGPL-2.1-or-later"

# Licence texts of code that libvmaf and libplacebo compile in besides their own (third_party/licenses/<dep>/,
# staged into THIRD_PARTY_NOTICES.md by cmake/OvtNotices.cmake; WI-0.017 follow-up). Each file is the text copied
# verbatim from the header of the bundled source in the pinned archive (libvmaf 3.0.0, libplacebo 7.349.0), or from
# the upstream project's own licence file where the archive carries none (mkdirp, pdjson, glumpy). The copyright
# and identifier are the bundled code's, not OVT's.
[[annotations]]
path = "third_party/licenses/libvmaf/libsvm-BSD-3-Clause.txt"
SPDX-FileCopyrightText = "2000-2019 Chih-Chung Chang and Chih-Jen Lin"
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = "third_party/licenses/libvmaf/xiph-psnr_hvs-BSD-2-Clause.txt"
SPDX-FileCopyrightText = "2001-2012 Xiph.Org and contributors"
SPDX-License-Identifier = "BSD-2-Clause"

[[annotations]]
path = "third_party/licenses/libvmaf/iqa-tdistler-BSD-3-Clause.txt"
SPDX-FileCopyrightText = "2011 Tom Distler"
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = "third_party/licenses/libvmaf/ciede2000-MIT.txt"
SPDX-FileCopyrightText = "2019 Joshua Holmer"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "third_party/licenses/libvmaf/dav1d-derived-BSD-2-Clause.txt"
SPDX-FileCopyrightText = "2018 VideoLAN and dav1d authors"
SPDX-License-Identifier = "BSD-2-Clause"

[[annotations]]
path = "third_party/licenses/libvmaf/x86inc-ISC.txt"
SPDX-FileCopyrightText = "2005-2020 x264 project"
SPDX-License-Identifier = "ISC"

[[annotations]]
path = "third_party/licenses/libvmaf/mkdirp-MIT.txt"
SPDX-FileCopyrightText = "2013 Stephen Mathieson"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "third_party/licenses/libvmaf/pdjson-Unlicense.txt"
SPDX-FileCopyrightText = "pdjson authors (public domain)"
SPDX-License-Identifier = "Unlicense"

[[annotations]]
path = "third_party/licenses/libplacebo/siphash-CC0-1.0.txt"
SPDX-FileCopyrightText = "2012-2016 Jean-Philippe Aumasson; 2012-2014 Daniel J. Bernstein"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "third_party/licenses/libplacebo/ccseqparse-naveros-Zlib.txt"
SPDX-FileCopyrightText = "2007-2016 Alexis Naveros"
SPDX-License-Identifier = "Zlib"

[[annotations]]
path = "third_party/licenses/libplacebo/glumpy-filters-BSD-3-Clause.txt"
SPDX-FileCopyrightText = "2014 Nicolas P. Rougier"
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = "third_party/licenses/dav1d/x86inc-ISC.txt"
SPDX-FileCopyrightText = "2005-2024 x264 project"
SPDX-License-Identifier = "ISC"

[[annotations]]
path = "third_party/licenses/dav1d/loongson-asm-ISC.txt"
SPDX-FileCopyrightText = "2022 Loongson Technology Corporation Limited"
SPDX-License-Identifier = "ISC"

# libde265's md5.cc: public domain with a permissive fallback grant, no SPDX id (the text is also LICENSES/).
[[annotations]]
path = "third_party/licenses/libde265/md5-LicenseRef-Peslyak-md5-public-domain.txt"
SPDX-FileCopyrightText = "2001 Alexander Peslyak"
SPDX-License-Identifier = "LicenseRef-Peslyak-md5-public-domain"

[[annotations]]
path = "third_party/licenses/libaom/x86inc-ISC.txt"
SPDX-FileCopyrightText = "2005-2019 x264 project"
SPDX-License-Identifier = "ISC"

# zlib's notice (the header of zlib.h, upstream 1.3): libz is a system library that the FFmpeg flavours link
# (third_party/ffmpeg.cmake); OVT does not build it, but THIRD_PARTY_NOTICES.md lists it, so its text is kept
# in third_party/system-licenses/<component>/, which cmake/OvtNotices.cmake passes to tools/gen_notices.py.
[[annotations]]
path = "third_party/system-licenses/zlib/zlib-Zlib.txt"
SPDX-FileCopyrightText = "1995-2023 Jean-loup Gailly and Mark Adler"
SPDX-License-Identifier = "Zlib"

# UVQ (WI-3.314): the YouTube-8M class names exported from google/uvq's contentnet_labels.csv (the "Name"
# column, one per line) are upstream data, Apache-2.0 like the rest of that repository (chapter 9 §9.6.1).
[[annotations]]
path = ["core/share/models/uvq/labels_yt8m.txt"]
SPDX-FileCopyrightText = "2025 Google LLC"
SPDX-License-Identifier = "Apache-2.0"

# The committed broken-ISOBMFF corpus generated by tools/make_broken.py (WI-1.201; chapter 08 section 8.9.3).
# Generated test inputs are CC0.
[[annotations]]
path = ["tests/corpora/synthetic/isobmff-broken/*.mp4"]
SPDX-FileCopyrightText = "2026 The Open Video Tools contributors"
SPDX-License-Identifier = "CC0-1.0"

# Debian packaging files that cannot carry a header (WI-0.072): the install lists, changelog, copyright and format
# files. packaging/debian/README.source is prose and falls under the Markdown rule's licence only by suffix, so it is listed.
[[annotations]]
path = ["packaging/debian/*.install", "packaging/debian/changelog", "packaging/debian/copyright",
        "packaging/debian/README.source", "packaging/debian/source/format"]
SPDX-FileCopyrightText = "2026 The Open Video Tools contributors"
SPDX-License-Identifier = "LGPL-2.1-or-later"

# The Gradle wrapper jar of the Android project (WI-0.050): the published Gradle 8.10 wrapper jar (SHA-256
# 2db75c40...8046 on gradle.org/release-checksums), unmodified, as in the v8.10.0 tag of gradle/gradle. gradlew and
# gradlew.bat come from the same tag and carry their own Apache-2.0 headers.
[[annotations]]
path = "android/gradle/wrapper/gradle-wrapper.jar"
SPDX-FileCopyrightText = "2015-2021 the original authors of Gradle"
SPDX-License-Identifier = "Apache-2.0"
