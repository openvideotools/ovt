#
# Gradle and project properties of the Android build (chapter 13 §13.4.1). Machine paths (sdk.dir, qt.dir) live
# in local.properties, which tools/bootstrap_android.sh writes and git ignores.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 8.6.0 (the version Qt 6.8 tests against) predates API 36; compileSdk 36 is pinned by D5 (§13.4.2).
android.suppressUnsupportedCompileSdk=36

# ABIs built and packaged (§13.4.7: x86_64 is mandatory for ChromeOS, arm64-v8a for Arm devices; no 32-bit).
ovt.abis=arm64-v8a;x86_64
# Branding (chapter 15 §15.7.4): the single source is cmake/OvtBranding.cmake once WI-0.606 generates these keys.
ovt.productName=OVT Studio
ovt.applicationId=org.openvideotools.studio
# CMake build type of the native code. The Qt Gradle plugin builds it once for every variant (debug and release).
ovt.nativeBuildType=RelWithDebInfo
