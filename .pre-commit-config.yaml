#
# Pre-commit hooks (chapter 13 §13.9.2, WI-0.007). Install once per clone:
#   pip install pre-commit==4.0.1 && pre-commit install --install-hooks -t pre-commit -t commit-msg
# Revisions are pinned; Renovate (renovate.json) proposes updates. The lint job of CI (WI-0.030) runs the
# hooks on the files a pull request changes (`pre-commit run --from-ref origin/main --to-ref HEAD`): the files
# written before WI-0.007 have not been reformatted yet, so `--all-files` would rewrite them.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
# Licence texts stay byte-identical to their sources (SPDX License List, libaom PATENTS): no whitespace fixes.
exclude: ^(third_party/vcpkg/|docs/spec/|LICENSES/|LICENSE$|plugins/ovt-plugin-aom/PATENTS$)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=2048]          # corpora and large goldens are never committed (§14.4)
      # Patches stay byte-exact: a blank context line is a single space, and git apply needs it.
      - id: end-of-file-fixer
        exclude: (^|/)patches/.*\.patch$
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: (^|/)patches/.*\.patch$

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.6
    hooks:
      - id: clang-format
        types_or: [c, c++, objective-c]
        # x264's SSIM kernel is vendored byte-exact (WI-0.565); its style is x264's.
        exclude: ^tests/oracles/x264_ssim/pixel_ssim\.c$

  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format
        additional_dependencies: [pyyaml==6.0.2]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--line-length=120]
      - id: ruff-format
        args: [--line-length=120]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        files: ^(tools|python)/
        args: [--ignore-missing-imports, --python-version=3.11]

  # Only the staged files; the full-tree `reuse lint` is the CI job (WI-0.030). Markdown and JSON are covered
  # by REUSE.toml once WI-0.600 adds it, so the per-file check is limited to the FR-GEN-105 source types.
  - repo: https://github.com/fsfe/reuse-tool
    rev: v5.0.2
    hooks:
      - id: reuse-lint-file
        files: (\.(c|h|cpp|hpp|mm|fbs|py|kt|kts|qml|js|cmake|sh|toml|yml|yaml|rb)|/CMakeLists\.txt|^CMakeLists\.txt)$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.14.0
    hooks:
      - id: pretty-format-kotlin       # ktlint; needs a JDK, runs only when *.kt files change
        args: [--autofix, --ktlint-version=1.5.0]

  - repo: local
    hooks:
      # SPDX headers (chapter 15 §15.1.1, WI-0.601): insert a missing one, then check every id against
      # tools/license_policy.toml [directories]. A wrong id is reported, never rewritten (`licence:` PR).
      - id: spdx-header
        name: SPDX header present (tools/spdx_header.py)
        entry: python3 -I tools/spdx_header.py
        language: system
        files: (\.(c|h|cpp|hpp|mm|fbs|py|kt|kts|qml|js|cmake|sh|toml|yml|yaml|rb)|(^|/)CMakeLists\.txt)$
        exclude: (_generated\.h|/Branding\.qml|/patches/)
      - id: check-spdx-dirs
        name: SPDX licence matches the directory (tools/check_spdx_dirs.py)
        entry: python3 -I tools/check_spdx_dirs.py
        language: system
        files: (\.(c|h|cpp|hpp|mm|fbs|py|kt|kts|qml|js|cmake|sh|toml|yml|yaml|rb)|(^|/)CMakeLists\.txt)$
      - id: check-schema-in-spec
        name: core/schema/*.fbs equals its fenced block in chapter 06 (tools/check_schema_in_spec.py)
        entry: python3 -I tools/check_schema_in_spec.py docs/spec/06-data-model.md core/schema
        language: system
        files: ^(core/schema/.*\.fbs|docs/spec/06-data-model\.md|tools/check_schema_in_spec\.py)$
        pass_filenames: false
      - id: check-versions-md
        name: VERSIONS.md matches the third_party scripts
        entry: python3 -I tools/check_versions_md.py
        language: system
        files: ^(third_party/|tools/versions_to_cmake\.py|tools/check_versions_md\.py)
        pass_filenames: false
      - id: check-patches
        name: decoder patch headers and Upstream-Status ageing (tools/check_patches.py)
        entry: python3 -I tools/check_patches.py
        language: system
        files: (^|/)patches/.*\.patch$
      - id: check-wi-refs
        name: commit message references a WI id or an issue
        entry: python3 -I tools/check_wi_refs.py --commit-msg
        language: system
        stages: [commit-msg]
      # DCO (chapter 15 §15.7): the hook does not add the trailer itself; it stops the commit and says how.
      - id: dco-signoff
        name: "DCO Signed-off-by trailer (missing? commit with `git commit -s`; see docs/dev/dco.md)"
        entry: "^Signed-off-by: .+ <[^>]+>"
        language: pygrep
        args: [--negate, --multiline]
        stages: [commit-msg]
